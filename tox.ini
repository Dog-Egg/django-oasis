[tox]
env_list = test

[testenv:test]
deps = 
    -r openapi/requirements.txt
    pytest
    pytest-django
commands = pytest

[testenv:docdev]
usedevelop = true
deps = 
    -r openapi/requirements.txt
    sphinx-autobuild
    git+https://github.com/Dog-Egg/sphinx-swaggerui.git
commands = sphinx-autobuild docs docs/_build
